name: shop_bloc
description: "Shop BLoC application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Local storage
  shared_preferences: ^2.2.3

  # BLoC
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5

  # Firebase
  cloud_firestore: ^5.0.1
  firebase_core: ^3.10.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1

  # Auth
  firebase_auth: ^5.4.1

  one_day_auth:
    path: ../../Packages/dreambit-flutter-auth1

  # Core
  get_it: ^7.7.0
  auto_route: ^8.1.3
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Freezed
  freezed: ^2.5.3
  freezed_annotation: ^2.4.1

  # Utils
  meta: ^1.12.0
  stream_transform: ^2.1.0
  logger: ^2.3.0
  intl_utils: ^2.8.7
  url_strategy: ^0.2.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # UnmodifiableUint8ListView
  win32: ^5.10.1

dependency_overrides:
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  auto_route_generator: ^8.0.0
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.5.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/svg/

flutter_gen:
  output: lib/core/assets/generated
  line_length: 80

flutter_intl:
  enabled: true
  class_name: AppLocalization
  main_locale: en
  arb_dir: lib/core/localization/translations
  output_dir: lib/core/localization/generated
